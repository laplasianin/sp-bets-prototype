spring:
  application:
    name: sporty-home

  datasource:
    url: jdbc:h2:mem:betsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      schema-locations: classpath:db/migration/V1__init.sql
      data-locations: classpath:data.sql
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console

  jooq:
    sql-dialect: H2

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: settlement-orchestrator
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.example.betting.domain"
        spring.json.value.default.type: com.example.betting.domain.EventOutcome

app:
  topics:
    event-outcomes: event-outcomes

logging:
  level:
    com.example.betting: INFO
    org.springframework.kafka: WARN
